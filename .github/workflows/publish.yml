name: publish
on:
  release: { types: [published] }
  # Lets a publish be triggered by hand, so validating the trusted-publisher
  # configuration doesn't require manufacturing a release.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required: npm exchanges this OIDC token for publish rights

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10.x. Trusted publishing (OIDC) needs npm >= 11.5.1,
      # and without it `npm publish` falls back to looking for a token and fails.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test

      # No NODE_AUTH_TOKEN. Authentication is the OIDC token above, exchanged
      # for a short-lived credential. Provenance is attached automatically.
      - run: npm publish --access public
