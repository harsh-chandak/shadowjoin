name: publish
on:
  release: { types: [published] }
  # Lets a publish be triggered by hand, so validating the trusted-publisher
  # configuration doesn't require manufacturing a release.
  workflow_dispatch:

# Deliberately read-only at the workflow level: id-token: write is granted
# per job, to the two that actually exchange it.
permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # npm exchanges this OIDC token for publish rights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10.x. Trusted publishing (OIDC) needs npm >= 11.5.1,
      # and without it `npm publish` falls back to looking for a token and fails.
      # Pinned, and installed without lifecycle scripts. 12.2.2 is the version the
      # 0.4.0 release published under, so this pins a proven one rather than
      # whatever `latest` resolves to on the day. npm itself declares no
      # install/prepare scripts, so --ignore-scripts costs nothing here.
      - run: npm install -g --ignore-scripts npm@12.2.2
      - run: npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test

      # npm refuses to republish a version, so without this check a re-run
      # fails here and the registry job below — which may be the only reason
      # for the re-run — never gets to execute. That is exactly how a release
      # half-lands: npm served the version and the registry still advertised
      # the old one.
      - name: is this version already on npm?
        id: served
        run: |
          set -euo pipefail
          PKG="$(jq -r .name package.json)"
          VER="$(jq -r .version package.json)"
          if curl -fsSL --proto '=https' --proto-redir '=https' "https://registry.npmjs.org/${PKG}" | jq -e --arg v "$VER" '.versions[$v]' >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "npm already serves ${PKG}@${VER} — skipping publish, continuing to the registry"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN. Authentication is the OIDC token above, exchanged
      # for a short-lived credential. Provenance is attached automatically.
      - if: steps.served.outputs.already == 'false'
        run: npm publish --access public

  # The npm publish above is only half of a release: the MCP registry entry
  # points at a package version, and left behind it advertises the old one.
  # shadowjoin's registry entries were pushed by hand until 0.4.0, which is
  # why 0.3.x landed on npm and the listing lagged.
  # The registry resolves the launcher, so the launcher must be on npm before
  # mcp-publisher runs. Its first version was published by hand because npm's
  # trusted publishing cannot bootstrap a name that does not exist; from here
  # it releases in lockstep with the package it launches.
  launcher:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/shadowjoin-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Pinned, and installed without lifecycle scripts. 12.2.2 is the version the
      # 0.4.0 release published under, so this pins a proven one rather than
      # whatever `latest` resolves to on the day. npm itself declares no
      # install/prepare scripts, so --ignore-scripts costs nothing here.
      - run: npm install -g --ignore-scripts npm@12.2.2

      - name: is this version already on npm?
        id: served
        run: |
          set -euo pipefail
          PKG="$(jq -r .name package.json)"
          VER="$(jq -r .version package.json)"
          if curl -fsSL --proto '=https' --proto-redir '=https' "https://registry.npmjs.org/${PKG}" | jq -e --arg v "$VER" '.versions[$v]' >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "npm already serves ${PKG}@${VER} — skipping"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # No build step: the launcher is one file and carries no dist/.
      - if: steps.served.outputs.already == 'false'
        run: npm publish --access public

  mcp-registry:
    needs: [npm, launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: install mcp-publisher
        run: |
          set -euo pipefail
          # The release assets carry no version in their filename — the version
          # lives only in the tag — so resolve the tag and keep the asset name
          # fixed. Download, verify, then extract: never pipe a download into a
          # program, because a piped download runs whatever arrives.
          TAG="$(curl -fsSL --proto '=https' --proto-redir '=https' https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | jq -r .tag_name)"
          VER="${TAG#v}"
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${TAG}"
          curl -fsSL --proto '=https' --proto-redir '=https' -o mcp-publisher_linux_amd64.tar.gz "${BASE}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' -o checksums.txt "${BASE}/registry_${VER}_checksums.txt"
          grep " mcp-publisher_linux_amd64.tar.gz$" checksums.txt | sha256sum --check --status
          echo "checksum verified"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      # Four files now have to agree, not three. packages[0].identifier names
      # the LAUNCHER, so packages[0].version is the launcher's version — the
      # old gate compared it against this package's and would have passed
      # while the registry resolved a launcher version npm had never served.
      - name: every version and the identifier must agree
        run: |
          set -euo pipefail
          PKG="$(jq -r .version package.json)"
          SRV="$(jq -r .version server.json)"
          SRVPKG="$(jq -r '.packages[0].version' server.json)"
          SRVID="$(jq -r '.packages[0].identifier' server.json)"
          LNAME="$(jq -r .name packages/shadowjoin-mcp/package.json)"
          LVER="$(jq -r .version packages/shadowjoin-mcp/package.json)"
          LDEP="$(jq -r '.dependencies["shadowjoin"]' packages/shadowjoin-mcp/package.json)"
          fail=0
          [ "$PKG" = "$SRV" ]   || { echo "server.json version $SRV != package.json $PKG"; fail=1; }
          [ "$PKG" = "$SRVPKG" ] || { echo "packages[0].version $SRVPKG != $PKG"; fail=1; }
          [ "$PKG" = "$LVER" ]  || { echo "launcher version $LVER != $PKG"; fail=1; }
          [ "$PKG" = "$LDEP" ]  || { echo "launcher depends on shadowjoin@$LDEP, not $PKG"; fail=1; }
          [ "$SRVID" = "$LNAME" ] || { echo "packages[0].identifier $SRVID is not the launcher $LNAME"; fail=1; }
          [ $fail -eq 0 ] || exit 1
          echo "package, server.json, launcher and its dependency all agree on $PKG; identifier is $SRVID"

      # The registry refuses to register a version npm does not serve yet, and
      # npm's propagation can outlast a registry token's lifetime. Wait for npm
      # FIRST, then authenticate, so the token is minted against a version the
      # registry can already see.
      - name: wait for npm to serve this version
        run: |
          set -euo pipefail
          PKG="$(jq -r '.packages[0].identifier' server.json)"
          VER="$(jq -r '.packages[0].version' server.json)"
          for i in $(seq 1 30); do
            if curl -fsSL --proto '=https' --proto-redir '=https' "https://registry.npmjs.org/${PKG}" | jq -e --arg v "$VER" '.versions[$v]' >/dev/null 2>&1; then
              echo "npm serves ${PKG}@${VER} after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "npm did not serve ${PKG}@${VER} within 300s"
          exit 1

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
