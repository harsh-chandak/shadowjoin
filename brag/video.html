<!doctype html>
<meta charset="utf-8" />
<!--
  Renders brag/session.js, produced by brag/record.mjs running the real CLI
  and capturing stdout verbatim. The previous version of this file had the
  numbers hardcoded in spans; nothing here is typed by hand except the
  narration lines, which are styled differently so they cannot be read as
  output.

  Sized for a portfolio card: 880px wide at 2x, 24px type, so at a 440px
  slot the text lands near 12px and stays readable. A full-width terminal
  shrunk to a card renders around 5px and is unreadable whatever it says.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:880px;height:600px;background:#010409;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .term{width:848px;height:568px;background:#0d1117;border:1px solid #30363d;border-radius:14px;
        box-shadow:0 18px 50px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column}
  .bar{height:44px;flex:0 0 44px;background:#161b22;border-bottom:1px solid #30363d;
       display:flex;align-items:center;padding:0 18px;gap:10px}
  .dot{width:13px;height:13px;border-radius:50%}
  .title{color:#6e7681;font-size:17px;margin-left:12px}
  .view{flex:1;overflow:hidden;position:relative}
  .body{position:absolute;left:0;right:0;top:0;padding:16px 24px;font-size:23px;line-height:1.5;
        color:#c9d1d9;white-space:pre-wrap;word-break:break-word}
  .say{color:#8b949e}.cmd{color:#58a6ff}.dimline{color:#6e7681}
  .yl{color:#d29922}.gn{color:#3fb950}.big{color:#f0f6fc;font-weight:600}
</style>
<div class="term">
  <div class="bar">
    <div class="dot" style="background:#ff5f56"></div><div class="dot" style="background:#ffbd2e"></div>
    <div class="dot" style="background:#27c93f"></div>
    <div class="title">shadowjoin — S&amp;P 500 against NYSE/Nasdaq listings</div>
  </div>
  <div class="view"><div class="body" id="out"></div></div>
</div>
<script src="./session.js"></script>
<script>
const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const paint = (l) => {
  const h = esc(l);
  if (/LOWER BOUND/.test(l)) return `<span class="yl">${h}</span>`;
  if (/verified against ground truth/.test(l)) return `<span class="gn">${h}</span>`;
  if (/recovered by shadow join|exact join matches/.test(l)) return `<span class="big">${h}</span>`;
  if (/^\s*\d+\./.test(l) || /^\s*rule\s/.test(l)) return `<span class="dimline">${h}</span>`;
  return h;
};

// Stop after the verification line: the per-rule tables are the useful part
// in a terminal and dead weight in a card-sized loop.
const rows = [];
let t = 0.5;
for (const step of window.__SESSION) {
  if (step.kind === "say") { rows.push({t, html:`<span class="say">${esc(step.text)}</span>`}); t += 1.1; }
  else if (step.kind === "cmd") {
    rows.push({t, html:""});
    // Only the first line carries the prompt; a continuation after a
    // backslash is the same command, and a second $ reads as a new one.
    step.text.split("\n").forEach((l, i) => {
      const lead = i === 0 ? `<span class="dimline">$ </span>` : `<span class="dimline">  </span>`;
      rows.push({t, html:`${lead}<span class="cmd">${esc(l)}</span>`});
    });
    t += 0.8;
  } else if (step.kind === "out") {
    const all = step.text.split("\n");
    const stop = all.findIndex((l) => /^\s*rule\s/.test(l));
    const keep = all.slice(0, stop === -1 ? all.length : stop);
    for (const l of keep) {
      rows.push({t, html:paint(l)});
      t += /verified against ground truth|LOWER BOUND/.test(l) ? 0.9 : 0.12;
    }
    t += 1.8;
  }
}
const DURATION = t + 1.0;
const el = document.getElementById("out");
const LINE = 23 * 1.5, VIEW = 568 - 44 - 32;
window.renderAt = (time) => {
  const shown = rows.filter((r) => r.t <= time);
  el.innerHTML = shown.map((r) => `<div>${r.html || "&nbsp;"}</div>`).join("");
  const over = shown.length * LINE - VIEW;
  el.style.transform = `translateY(${over > 0 ? -over : 0}px)`;
};
window.__duration = DURATION;
window.renderAt(0);
window.__ready = true;
</script>
