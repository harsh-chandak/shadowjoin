# Duplication is measured on src/ only.
#
# Each test case builds its own two small tables so the expected tuple
# reduction is visible beside the assertion, which the duplication detector
# counts as copy-paste. That inline-ness matters most in test/composite.test.js,
# where the cases assert arithmetic that must audit against itself: `agreement`
# partitioning the missed rows, the full:true bucket equalling `recovered`, and
# length-prefixing stopping ("ab","c") colliding with ("a","bc"). Factoring the
# table construction out would hide the inputs those invariants hold over.
#
# So this narrows the metric rather than the tests. Duplication inside src/ is
# still a gate failure.
sonar.cpd.exclusions=test/**
